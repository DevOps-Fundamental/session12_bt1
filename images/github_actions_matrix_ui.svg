    <text x="56" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#8b949e">Commit: feat: configure matrix strategy for JDK 17 and 21 • Branch: main • Run 1</text>
    
